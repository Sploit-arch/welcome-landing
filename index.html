<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Personal profile website">
  <link rel="preload" href="site-music.mp3" as="audio" type="audio/mpeg">
  <title>HENCartell exploit host</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070a;
      --card: rgba(18, 18, 24, .72);
      --card-2: rgba(24, 24, 32, .58);
      --border: rgba(255,255,255,.09);
      --text: #f5f5f7;
      --muted: #92929d;
      --accent: #9b5cff;
      --accent-2: #6f35ff;
      --glow: rgba(137, 71, 255, .25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(129, 62, 255, .18), transparent 34%),
        radial-gradient(circle at 10% 45%, rgba(95, 38, 180, .08), transparent 28%),
        var(--bg);
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }



    .nav {
      width: min(1100px, calc(100% - 32px));
      margin: 22px auto 0;
      padding: 12px 14px 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(11, 11, 15, .65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: sticky;
      top: 16px;
      z-index: 20;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 10px;
      transition: .2s ease;
    }

    .nav-links a:hover {
      color: white;
      background: rgba(255,255,255,.06);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: auto;
    }

    .hero {
      min-height: 76vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 90px 0 55px;
    }

    .hero-inner {
      max-width: 720px;
      animation: rise .8s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 24px;
      border-radius: 30px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,255,255,.35), var(--accent), transparent);
      box-shadow: 0 0 50px rgba(132, 66, 255, .18);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: #111116;
      color: #777781;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      overflow: hidden;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status {
      width: fit-content;
      margin: 0 auto 18px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b7b7c1;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .11em;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
    }

    .status span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #70e29a;
      box-shadow: 0 0 12px #70e29a;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(46px, 8vw, 82px);
      line-height: .98;
      letter-spacing: -.055em;
      margin-bottom: 20px;
    }

    h1 .gradient {
      background: linear-gradient(100deg, #fff 15%, #b982ff 55%, #8350ff 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero h1 + .status {
      margin: 0 auto 24px;
    }

    .hero p {
      max-width: 590px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .hero-actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-width: 125px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: #eee;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255,255,255,.035);
      transition: .2s ease;
    }

    .btn.primary {
      border-color: rgba(153, 92, 255, .45);
      background: linear-gradient(135deg, #9558ff, #7135e8);
      box-shadow: 0 12px 35px rgba(116, 54, 235, .22);
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.18);
    }

    section {
      padding: 42px 0;
      scroll-margin-top: 95px;
    }

    .section-head {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: #9e7bdb;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: 8px;
    }

    .section-head h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
      letter-spacing: -.035em;
    }

    .about-card, .links-card, .project {
      border: 1px solid var(--border);
      background: linear-gradient(145deg, var(--card), var(--card-2));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.18);
    }

    .about-card {
      padding: 28px;
      border-radius: 22px;
    }

    .about-card p {
      color: #aaaab4;
      line-height: 1.85;
      font-size: 14px;
    }

    .about-card p + p { margin-top: 13px; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .link-card {
      min-height: 72px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: white;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
      transition: .2s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: rgba(155,92,255,.4);
      background: rgba(155,92,255,.06);
      box-shadow: 0 14px 35px rgba(0,0,0,.18);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      color: #c4a5ff;
      font-weight: 800;
      font-size: 13px;
    }

    .link-copy strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .link-copy small {
      color: #777783;
      font-size: 11px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .project {
      padding: 22px;
      border-radius: 20px;
    }

    .project-number {
      color: #6e6e78;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .project h3 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      margin: 28px 0 8px;
    }

    .project p {
      color: #85858f;
      font-size: 13px;
      line-height: 1.7;
      min-height: 44px;
    }

    .project-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .tag {
      padding: 6px 8px;
      color: #8f8f9b;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255,255,255,.025);
    }

    footer {
      padding: 70px 0 30px;
      text-align: center;
      color: #666670;
      font-size: 11px;
    }

    footer .footer-brand {
      color: #a7a7b0;
      font-weight: 700;
      margin-bottom: 7px;
    }

    @media (max-width: 650px) {
      .nav { margin-top: 12px; }
      .nav-links a { padding: 8px; font-size: 11px; }
      .hero { min-height: 72vh; padding-top: 70px; }
      .links-grid, .projects { grid-template-columns: 1fr; }
      .about-card { padding: 22px; }
      h1 { font-size: 52px; }
    }


    #xmb-waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 0;
    }
    body > *:not(#xmb-waves) { position: relative; }
    nav, main, footer { z-index: 1; }
    @media (prefers-reduced-motion: reduce) {
      #xmb-waves { display: none; }
    }
  </style>
</head>

<body>
  <canvas id="xmb-waves" aria-hidden="true"></canvas>

  <nav class="nav">
    <div class="brand">
      <span class="brand-dot"></span>
      ItsSploited
    </div>

  </nav>

  <main>
    <section class="hero" id="home">
      <div class="hero-inner">
        <h1><span class="gradient">HENCartel exploit host</span></h1>

        <div class="status">
          <span></span>
          Firmware 13.52 support
        </div>

        <div class="hero-actions">
          <a class="btn primary" href="https://sploit-arch.github.io/itssploited/" target="_blank" rel="noopener noreferrer">Jailbreak</a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <div class="footer-brand">HENCartel exploit host</div>
    <div>Credits: ItsSploited</div>
  </footer>

  <audio id="site-music" src="site-music.mp3" autoplay loop preload="auto" playsinline hidden style="display:none !important; width:0; height:0;" aria-hidden="true" tabindex="-1"></audio>

<script>
(() => {
  const canvas = document.getElementById('xmb-waves');
  const ctx = canvas && canvas.getContext('2d');
  if (!ctx) return;

  let w = 0, h = 0, dpr = 1, raf;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(time) {
    const t = time * 0.00022;
    ctx.clearRect(0, 0, w, h);

    // Deep midnight blue with a soft PS3-era violet glow.
    const bg = ctx.createRadialGradient(w * .32, h * .48, 0, w * .42, h * .5, Math.max(w, h) * .85);
    bg.addColorStop(0, '#11132b');
    bg.addColorStop(.48, '#080a18');
    bg.addColorStop(1, '#030409');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // Layered, fine silk ribbons inspired by the original PS3 XMB wave.
    const layers = [
      {amp: h*.105, base: h*.60, freq: 1.05, phase: 0.0, color: '64,105,255', alpha:.18, width:2.1},
      {amp: h*.085, base: h*.63, freq: 1.28, phase: 1.4, color: '107,87,255', alpha:.22, width:1.6},
      {amp: h*.12,  base: h*.57, freq: .82, phase: 2.5, color: '48,164,255', alpha:.13, width:1.2},
      {amp: h*.07,  base: h*.66, freq: 1.55, phase: 3.7, color: '154,113,255', alpha:.16, width:1.1},
      {amp: h*.095, base: h*.61, freq: 1.12, phase: 5.1, color: '94,143,255', alpha:.12, width:.9}
    ];

    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      ctx.beginPath();
      for (let x = -4; x <= w + 4; x += 4) {
        const u = x / Math.max(w, 1);
        const envelope = Math.sin(Math.PI * u) * .45 + .55;
        const y = L.base
          + Math.sin(u * Math.PI * 2 * L.freq + t * (1.0 + li*.08) + L.phase) * L.amp * envelope
          + Math.sin(u * Math.PI * 4.1 - t * .7 + L.phase) * L.amp * .22
          + (u - .5) * h * .08;
        if (x === -4) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${L.color},${L.alpha})`;
      ctx.lineWidth = L.width;
      ctx.shadowColor = `rgba(${L.color},.45)`;
      ctx.shadowBlur = li < 3 ? 13 : 6;
      ctx.stroke();
    }

    // Broad translucent wave bands give the lines a silky, flowing body.
    for (let i = 0; i < 3; i++) {
      const phase = t * (.72 + i*.12) + i * 2.1;
      ctx.beginPath();
      for (let x = -3; x <= w + 3; x += 5) {
        const u = x / Math.max(w, 1);
        const y = h*.61
          + Math.sin(u * Math.PI * (1.2 + i*.16) + phase) * h*(.105 + i*.012)
          + Math.sin(u * Math.PI * 3.4 - phase*.8 + i) * h*.035;
        if (x === -3) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      const glow = ctx.createLinearGradient(0, h*.42, 0, h*.78);
      glow.addColorStop(0, `rgba(${i===1?'85,110,255':'92,79,220'},0)`);
      glow.addColorStop(.45, `rgba(${i===1?'85,110,255':'92,79,220'},.055)`);
      glow.addColorStop(1, `rgba(${i===1?'85,110,255':'92,79,220'},0)`);
      ctx.strokeStyle = glow;
      ctx.lineWidth = 24 + i*10;
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    if (!reduced) raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, {passive:true});
  resize();
  draw(0);
})();

// Keep the supplied soundtrack; browsers may still require prior interaction for audible autoplay.
(() => {
  const audio = document.getElementById('site-music');
  if (!audio) return;
  audio.volume = 0.35;
  const play = () => {
    if (audio.paused) {
      const attempt = audio.play();
      if (attempt && typeof attempt.catch === 'function') attempt.catch(() => {});
    }
  };
  // Start immediately during initial parsing; preload hints let the browser fetch audio sooner.
  play();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audio.paused) play();
  });
})();
</script>
</body>
</html>
